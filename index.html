<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./episodes-data.js" defer></script>
    <script src="./script.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Rick and Morty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Outfit', system-ui, sans-serif; }</style>
</head>
<body class="bg-[url('/images/BG-RickyAndMorty.jpg')] bg-cover md:bg-no-repeat">
    <a href="#conteudo" class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-50 focus:rounded-lg focus:bg-white focus:px-4 focus:py-2 focus:font-medium focus:text-emerald-700 focus:shadow-lg">Pular para o conteúdo</a>
    <header class="sticky top-0 z-40 border-b border-emerald-900/10 bg-white shadow-[0_8px_24px_-16px_rgba(6,78,59,0.35)]">
        <div class="mx-auto flex h-[72px] max-w-[1200px] items-center justify-between px-6">
            <a href="./index.html" class="flex items-center gap-3 rounded-lg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500/60">
                <img src="./images/Logo-RAM.png" alt="Logo de Rick and Morty" width="44" height="44" class="h-11 w-11 object-contain">
                <span class="hidden text-lg font-semibold tracking-tight text-zinc-900 sm:inline">Rick and Morty</span>
            </a>
            <nav aria-label="Principal">
                <ul class="flex items-center gap-6 md:gap-10">
                    <li><a href="./index.html" aria-current="page" class="relative py-2 text-[15px] font-medium tracking-tight rounded transition-colors duration-200 active:translate-y-px focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500/60 after:absolute after:left-0 after:bottom-0 after:h-0.5 after:w-full after:origin-left after:bg-emerald-600 after:transition-transform after:duration-300 text-emerald-700 after:scale-x-100">Episódios</a></li>
                    <li><a href="./pages/personagens.html" class="relative py-2 text-[15px] font-medium tracking-tight rounded transition-colors duration-200 active:translate-y-px focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500/60 after:absolute after:left-0 after:bottom-0 after:h-0.5 after:w-full after:origin-left after:bg-emerald-600 after:transition-transform after:duration-300 text-zinc-600 hover:text-emerald-700 after:scale-x-0 hover:after:scale-x-100">Personagens</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main id="conteudo">
        <div class="relative z-30 flex items-center justify-center mt-20 px-4">
            <form class="flex flex-wrap items-center justify-center gap-4 bg-white/95 backdrop-blur-sm rounded-2xl shadow-[0_8px_24px_-10px_rgba(0,0,0,0.35)] px-6 py-5" onsubmit="return false">
                <select id="season" class="w-[200px]"></select>
                <select id="episode" class="w-[280px]"></select>
            </form>
        </div>
        <div class="flex flex-wrap items-center justify-center mt-20 mb-20 gap-10 px-4" id="ep-container">
            
        </div>
    </main>
</body>
</html>
